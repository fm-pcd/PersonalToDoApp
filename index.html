<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Todos">
  <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Todos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:    #007AFF;
      --danger:    #FF3B30;
      --success:   #34C759;
      --warning:   #FF9500;
      --bg:        #F2F2F7;
      --card:      #FFFFFF;
      --text:      #1C1C1E;
      --subtext:   #8E8E93;
      --sep:       rgba(60,60,67,.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:    #1C1C1E;
        --card:  #2C2C2E;
        --text:  #FFFFFF;
        --sep:   rgba(84,84,88,.65);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--sep);
      padding-top: env(safe-area-inset-top);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .header-inner {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 16px; height: 56px;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    .header-right { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: none; background: var(--bg); color: var(--accent);
      font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s;
    }
    .icon-btn:active { opacity: .5; }
    .sync-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); display: inline-block; margin-right: 4px;
    }
    .sync-dot.syncing { animation: pulse 1s infinite; background: var(--warning); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Filter bar ── */
    .filters {
      display: flex; gap: 8px; padding: 10px 16px 10px;
      background: var(--card); border-bottom: 1px solid var(--sep);
    }
    .filter-btn {
      padding: 5px 14px; border-radius: 20px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer;
      background: var(--bg); color: var(--subtext); transition: all .15s;
    }
    .filter-btn.active { background: var(--accent); color: #fff; }

    /* ── Setup banner ── */
    .setup-banner {
      background: var(--warning); color: #fff;
      padding: 10px 16px; font-size: 14px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    /* ── Main content ── */
    .main {
      padding: 16px; max-width: 680px; margin: 0 auto;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    .loading { text-align: center; padding: 60px 20px; color: var(--subtext); }

    /* ── Groups ── */
    .group { margin-bottom: 24px; }
    .group-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .6px; color: var(--subtext);
      margin-bottom: 8px; padding: 0 4px;
    }
    .group-label.overdue { color: var(--danger); }
    .group-label.today   { color: var(--accent); }

    /* ── Todo card ── */
    .todo-card {
      background: var(--card); border-radius: 12px;
      padding: 13px 14px; margin-bottom: 8px;
      display: flex; align-items: flex-start; gap: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
      cursor: pointer; transition: opacity .15s;
    }
    .todo-card:active { opacity: .7; }
    .todo-card.done { opacity: .45; }

    .check-ring {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--sep); margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: transparent;
      transition: all .2s; cursor: pointer;
    }
    .todo-card.done .check-ring {
      background: var(--success); border-color: var(--success); color: #fff;
    }

    .todo-body { flex: 1; min-width: 0; }
    .todo-title {
      font-size: 16px; font-weight: 500; line-height: 1.3;
    }
    .todo-card.done .todo-title {
      text-decoration: line-through; color: var(--subtext);
    }
    .todo-sub {
      font-size: 13px; color: var(--subtext); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .todo-meta {
      display: flex; align-items: center; gap: 6px;
      margin-top: 4px; flex-wrap: wrap;
    }
    .due-tag { font-size: 13px; color: var(--subtext); }
    .due-tag.overdue { color: var(--danger); font-weight: 600; }
    .due-tag.today   { color: var(--accent);  font-weight: 600; }

    .src-badge {
      font-size: 11px; padding: 2px 7px; border-radius: 5px;
      font-weight: 600; line-height: 1.4;
    }
    .src-email     { background: #FF9500; color:#fff; }
    .src-whatsapp  { background: #25D366; color:#fff; }
    .src-claude    { background: #7C3AED; color:#fff; }
    .src-manual    { background: var(--sep); color: var(--subtext); }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 70px 20px; color: var(--subtext);
    }
    .empty-icon { font-size: 52px; margin-bottom: 16px; }
    .empty-title { font-size: 19px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

    /* ── FAB ── */
    .fab {
      position: fixed;
      right: max(20px, env(safe-area-inset-right));
      bottom: calc(24px + env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #fff; border: none;
      font-size: 30px; cursor: pointer; z-index: 50;
      box-shadow: 0 4px 18px rgba(0,122,255,.45);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, box-shadow .15s;
    }
    .fab:hover { transform: scale(1.06); box-shadow: 0 6px 22px rgba(0,122,255,.55); }
    .fab:active { transform: scale(.93); }

    /* ── Modal overlay ── */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.5);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    @media (min-width: 600px) { .overlay { align-items: center; } }

    /* ── Modal sheet ── */
    .sheet {
      background: var(--card); width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      max-height: 90dvh; overflow-y: auto;
    }
    .overlay.open .sheet { transform: translateY(0); }
    @media (min-width: 600px) {
      .sheet {
        max-width: 460px; margin: auto;
        border-radius: 20px; padding: 24px;
        transform: scale(.9); opacity: 0;
        transition: transform .25s, opacity .25s;
      }
      .overlay.open .sheet { transform: scale(1); opacity: 1; }
    }

    .sheet-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 20px;
    }
    .sheet-title { font-size: 18px; font-weight: 700; }
    .close-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: var(--bg); color: var(--subtext);
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px;
      color: var(--subtext); margin-bottom: 6px;
    }
    input[type=text], input[type=date], input[type=password],
    input[type=url], textarea {
      width: 100%; padding: 12px 13px;
      border: 1.5px solid var(--sep); border-radius: 10px;
      font-size: 16px; font-family: inherit;
      background: var(--bg); color: var(--text);
      outline: none; transition: border-color .15s;
      -webkit-appearance: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: none; height: 76px; }

    .btn {
      display: block; width: 100%; padding: 14px;
      border-radius: 12px; border: none;
      font-size: 17px; font-weight: 600; cursor: pointer;
      transition: opacity .15s; margin-top: 10px;
    }
    .btn:active { opacity: .8; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-ghost   { background: var(--bg); color: var(--subtext); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(80px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 20px;
      font-size: 14px; font-weight: 600; color: #fff;
      z-index: 999; pointer-events: none;
      animation: toastIn .25s ease, toastOut .25s ease 2s forwards;
    }
    @keyframes toastIn  { from { opacity:0; transform: translateX(-50%) translateY(10px); } }
    @keyframes toastOut { to   { opacity:0; transform: translateX(-50%) translateY(10px); } }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="header">
  <div class="header-inner">
    <h1>Todos</h1>
    <div class="header-right">
      <span class="sync-dot" id="syncDot"></span>
      <button class="icon-btn" onclick="openSettings()" title="Settings">⚙</button>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('active',this)">Active</button>
    <button class="filter-btn"        onclick="setFilter('all',this)">All</button>
    <button class="filter-btn"        onclick="setFilter('done',this)">Done</button>
  </div>
</header>

<div id="setupBanner" class="setup-banner" onclick="openSettings()" style="display:none">
  ⚠️ Tap here to set up your Google Sheets connection
</div>

<!-- ── Main ────────────────────────────────────────────────────────────────── -->
<main class="main" id="main">
  <div class="loading">Loading…</div>
</main>

<button class="fab" onclick="openAdd()">+</button>

<!-- ── Add / Edit modal ─────────────────────────────────────────────────────── -->
<div class="overlay" id="addOverlay" onclick="closeOverlay('addOverlay')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-header">
      <div class="sheet-title" id="addTitle_">New Todo</div>
      <button class="close-btn" onclick="closeOverlay('addOverlay')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input type="text" id="f_title" placeholder="What needs doing?">
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea id="f_notes" placeholder="Optional notes…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Due Date</label>
      <input type="date" id="f_due">
    </div>
    <button class="btn btn-primary" onclick="submitTodo()">Save</button>
    <button class="btn btn-danger"  id="f_delete" onclick="confirmDelete()" style="display:none">Delete</button>
  </div>
</div>

<!-- ── Settings modal ───────────────────────────────────────────────────────── -->
<div class="overlay" id="settingsOverlay" onclick="closeOverlay('settingsOverlay')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-header">
      <div class="sheet-title">Settings</div>
      <button class="close-btn" onclick="closeOverlay('settingsOverlay')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Apps Script URL</label>
      <input type="url" id="s_url" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="form-group">
      <label class="form-label">Secret Token</label>
      <input type="password" id="s_token" placeholder="Your secret token">
    </div>
    <button class="btn btn-primary" onclick="saveSettings()">Save &amp; Connect</button>
    <button class="btn btn-ghost"   onclick="closeOverlay('settingsOverlay')">Cancel</button>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let todos    = [];
let todoMap  = {};   // id → todo object
let filter   = 'active';
let editId   = null;
let apiUrl   = localStorage.getItem('apiUrl')   || '';
let apiToken = localStorage.getItem('apiToken') || '';

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (!apiUrl || !apiToken) {
    document.getElementById('setupBanner').style.display = 'flex';
    document.getElementById('main').innerHTML = '';
    openSettings();
  } else {
    fetchTodos();
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
});

// ── API ───────────────────────────────────────────────────────────────────────
async function api(params) {
  const u = new URL(apiUrl);
  u.searchParams.set('token', apiToken);
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== '') u.searchParams.set(k, v); });
  setSyncing(true);
  try {
    const res  = await fetch(u.toString(), { redirect: 'follow' });
    const data = await res.json();
    setSyncing(false);
    if (data.error) { toast(data.error, 'var(--danger)'); return null; }
    return data;
  } catch {
    setSyncing(false);
    toast('Connection failed — check Settings', 'var(--danger)');
    return null;
  }
}

async function fetchTodos() {
  const data = await api({ action: 'list' });
  if (data?.todos) {
    todos   = data.todos;
    todoMap = Object.fromEntries(todos.map(t => [t.id, t]));
    render();
  }
}

// ── CRUD wrappers ─────────────────────────────────────────────────────────────
async function submitTodo() {
  const title = document.getElementById('f_title').value.trim();
  if (!title) { document.getElementById('f_title').focus(); return; }
  const params = {
    action: editId ? 'update' : 'add',
    title,
    notes:  document.getElementById('f_notes').value.trim(),
    due:    document.getElementById('f_due').value,
    source: 'manual',
  };
  if (editId) params.id = editId;
  const result = await api(params);
  if (result?.success || result?.id) { closeOverlay('addOverlay'); fetchTodos(); }
}

async function toggleDone(id, isDone) {
  await api({ action: 'update', id, done: (!isDone).toString() });
  fetchTodos();
}

async function confirmDelete() {
  if (!editId) return;
  if (!confirm('Delete this todo?')) return;
  const result = await api({ action: 'delete', id: editId });
  if (result?.success) { closeOverlay('addOverlay'); fetchTodos(); }
}

// ── Modals ────────────────────────────────────────────────────────────────────
function openAdd() {
  editId = null;
  document.getElementById('addTitle_').textContent   = 'New Todo';
  document.getElementById('f_title').value           = '';
  document.getElementById('f_notes').value           = '';
  document.getElementById('f_due').value             = '';
  document.getElementById('f_delete').style.display  = 'none';
  openOverlay('addOverlay');
  setTimeout(() => document.getElementById('f_title').focus(), 300);
}

function openEdit(id) {
  const t = todoMap[id];
  if (!t) return;
  editId = id;
  document.getElementById('addTitle_').textContent   = 'Edit Todo';
  document.getElementById('f_title').value           = t.title;
  document.getElementById('f_notes').value           = t.notes || '';
  document.getElementById('f_due').value             = t.due_date || '';
  document.getElementById('f_delete').style.display  = 'block';
  openOverlay('addOverlay');
}

function openSettings() {
  document.getElementById('s_url').value   = apiUrl;
  document.getElementById('s_token').value = apiToken;
  openOverlay('settingsOverlay');
}

function saveSettings() {
  apiUrl   = document.getElementById('s_url').value.trim();
  apiToken = document.getElementById('s_token').value.trim();
  localStorage.setItem('apiUrl',   apiUrl);
  localStorage.setItem('apiToken', apiToken);
  closeOverlay('settingsOverlay');
  document.getElementById('setupBanner').style.display = 'none';
  fetchTodos();
}

function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── Sync indicator ────────────────────────────────────────────────────────────
function setSyncing(on) {
  document.getElementById('syncDot').className = 'sync-dot' + (on ? ' syncing' : '');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, bg = 'var(--success)') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.background = bg;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

// ── Date helpers ──────────────────────────────────────────────────────────────
function todayStr() { return new Date().toISOString().split('T')[0]; }

function dueMeta(dateStr) {
  if (!dateStr || dateStr === 'undefined') return null;
  const today = todayStr();
  const diff  = Math.round((new Date(dateStr + 'T12:00:00') - new Date(today + 'T12:00:00')) / 86400000);
  if (diff < 0)  return { text: `${Math.abs(diff)}d overdue`, cls: 'overdue' };
  if (diff === 0) return { text: 'Today',    cls: 'today' };
  if (diff === 1) return { text: 'Tomorrow', cls: '' };
  if (diff < 7)   return { text: new Date(dateStr + 'T12:00:00').toLocaleDateString('en', { weekday: 'long' }), cls: '' };
  return { text: new Date(dateStr + 'T12:00:00').toLocaleDateString('en', { month: 'short', day: 'numeric' }), cls: '' };
}

function groupKey(todo) {
  const d = todo.due_date;
  if (!d || d === 'undefined' || d === '') return 'none';
  const today = todayStr();
  if (d < today) return 'overdue';
  if (d === today) return 'today';
  const diff = Math.round((new Date(d + 'T12:00:00') - new Date(today + 'T12:00:00')) / 86400000);
  return diff <= 6 ? 'week' : 'later';
}

// ── Render ────────────────────────────────────────────────────────────────────
const GROUP_ORDER  = ['overdue', 'today', 'week', 'later', 'none'];
const GROUP_LABELS = { overdue: 'Overdue', today: 'Today', week: 'This Week', later: 'Later', none: 'No Date' };

function render() {
  const main = document.getElementById('main');
  let list = todos;
  if (filter === 'active') list = todos.filter(t => t.done !== 'TRUE');
  if (filter === 'done')   list = todos.filter(t => t.done === 'TRUE');

  if (list.length === 0) {
    const msgs = {
      active: ['✅', 'All clear!',      'Tap + to add a todo'],
      done:   ['🎉', 'Nothing done yet', ''],
      all:    ['📋', 'No todos yet',     'Tap + to get started'],
    };
    const [icon, title, sub] = msgs[filter];
    main.innerHTML = `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${title}</div><div>${sub}</div></div>`;
    return;
  }

  // group
  const groups = {};
  list.forEach(t => { const k = groupKey(t); (groups[k] = groups[k] || []).push(t); });

  let html = '';
  GROUP_ORDER.forEach(key => {
    const items = groups[key];
    if (!items) return;
    const labelCls = (key === 'overdue' || key === 'today') && filter !== 'done' ? key : '';
    html += `<div class="group"><div class="group-label ${labelCls}">${GROUP_LABELS[key]}</div>`;
    items.forEach(t => {
      const done = t.done === 'TRUE';
      const due  = dueMeta(t.due_date);
      const src  = t.source || 'manual';
      const srcLabels = { email: '✉ Email', whatsapp: '💬 WhatsApp', claude: '✦ Claude' };
      html += `
        <div class="todo-card${done ? ' done' : ''}" data-id="${t.id}" onclick="openEdit('${esc(t.id)}')">
          <div class="check-ring" onclick="event.stopPropagation(); toggleDone('${esc(t.id)}', ${done})">✓</div>
          <div class="todo-body">
            <div class="todo-title">${esc(t.title)}</div>
            ${t.notes && t.notes !== 'undefined' ? `<div class="todo-sub">${esc(t.notes)}</div>` : ''}
            <div class="todo-meta">
              ${due ? `<span class="due-tag ${due.cls}">${due.text}</span>` : ''}
              ${src !== 'manual' && srcLabels[src] ? `<span class="src-badge src-${src}">${srcLabels[src]}</span>` : ''}
            </div>
          </div>
        </div>`;
    });
    html += '</div>';
  });
  main.innerHTML = html;
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const active = document.activeElement;
  const typing = active.tagName === 'INPUT' || active.tagName === 'TEXTAREA';
  if (e.key === 'n' && !typing && !e.metaKey && !e.ctrlKey) openAdd();
  if (e.key === 'Escape') { closeOverlay('addOverlay'); closeOverlay('settingsOverlay'); }
});
</script>
</body>
</html>
